<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(-45deg, #ff4d6d, #ff758c, #ff9a9e, #ffd6e0);
      background-size: 400% 400%;
      animation: romanticBg 14s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
    }

    @keyframes romanticBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: white;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px 40px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 28px;
      color: #ff4d6d;
      line-height: 1.3;
    }

    .buttons {
      position: relative;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    button {
      font-size: 18px;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.95);
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758c);
      color: white;
      box-shadow: 0 12px 25px rgba(255, 77, 109, 0.5);
      z-index: 2;
    }

    #no {
      background: #dee2e6;
      color: #333;
      position: absolute;
      z-index: 1;
    }

    .hint {
      margin-top: 18px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="title">Will you be my Valentine? 💘🌹</h1>

    <div class="buttons" id="buttonArea">
      <button id="yes">YES 💖</button>
      <button id="no">NO 🙂</button>
    </div>

    <div class="hint">💞 Both answers are okay</div>
  </div>

  <script>
    // 💕 Name from URL
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");

    if (name) {
      document.getElementById("title").innerText =
        `Hey ${decodeURIComponent(name)} ❤️ Will you be my Valentine? 💕`;
    }

    const noBtn = document.getElementById("no");
    const area = document.getElementById("buttonArea");

    function moveNoButton() {
      const areaRect = area.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = areaRect.width - btnRect.width;
      const maxY = areaRect.height - btnRect.height;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    // Hover on desktop, hover-like on mobile
    noBtn.addEventListener("pointerenter", moveNoButton);
  </script>

</body>
</html>
