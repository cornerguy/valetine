<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(-45deg, #ff4d6d, #ff758c, #ff9a9e, #ffd6e0);
      background-size: 400% 400%;
      animation: romanticBg 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
    }

    @keyframes romanticBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 🍝 Spaghetti ribbons */
    .spaghetti {
      position: absolute;
      width: 6px;
      height: 120px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      animation: float 8s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(110vh) rotate(0deg);
      }
      to {
        transform: translateY(-150px) rotate(360deg);
      }
    }

    .card {
      background: white;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px 40px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 10;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 30px;
      color: #ff4d6d;
      line-height: 1.3;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      height: 60px;
    }

    button {
      font-size: 18px;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.95);
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758c);
      color: white;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.5);
    }

    #no {
      background: #dee2e6;
      color: #333;
      position: absolute;
    }

    .hint {
      margin-top: 18px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>

  <!-- 🍝 Spaghetti -->
  <div class="spaghetti" style="left:10%; animation-delay:0s;"></div>
  <div class="spaghetti" style="left:30%; animation-delay:2s;"></div>
  <div class="spaghetti" style="left:50%; animation-delay:4s;"></div>
  <div class="spaghetti" style="left:70%; animation-delay:1s;"></div>
  <div class="spaghetti" style="left:90%; animation-delay:3s;"></div>

  <div class="card">
    <h1 id="title">Will you be my Valentine? 💘🌹</h1>

    <div class="buttons">
      <button id="yes">YES 💖</button>
      <button id="no">NO 😅</button>
    </div>

    <div class="hint">💞 Be honest… from your heart</div>
  </div>

  <script>
    // 💕 Name from URL
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");

    if (name) {
      document.getElementById("title").innerText =
        `Hey ${decodeURIComponent(name)} ❤️ Will you be my Valentine? 💕`;
    }

    // 🏃‍♂️ NO button hover only
    const noBtn = document.getElementById("no");

    function moveNoButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton);

    // 💍 YES click
    document.getElementById("yes").addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:36px;
          font-family:Poppins, sans-serif;
          background:linear-gradient(135deg,#ff4d6d,#ff9a9e);
          color:white;
          text-align:center;
          padding:20px;
        ">
          💖🌹 YES!!!<br>Best Valentine Ever 💕🥰
        </div>
      `;
    });
  </script>
</body>
</html>
