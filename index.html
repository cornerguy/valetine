<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(-45deg, #ff4d6d, #ff758c, #ff9a9e, #ffd6e0);
      background-size: 400% 400%;
      animation: bg 14s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    @keyframes bg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: white;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px 40px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 28px;
      color: #ff4d6d;
      line-height: 1.3;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    button {
      font-size: 18px;
      padding: 14px 0;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758c);
      color: white;
      box-shadow: 0 12px 25px rgba(255, 77, 109, 0.5);
    }

    #no {
      background: #dee2e6;
      color: #333;
    }

    .hint {
      margin-top: 18px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="title">Will you be my Valentine? 💘🌹</h1>

    <div class="buttons">
      <button id="yes">YES 💖</button>
      <button id="no">NO 🙂</button>
    </div>

    <div class="hint">💞 Both answers are okay</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const title = document.getElementById("title");

    // 🎯 Get name from URL (?name=Alex)
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");

    if (name) {
      title.textContent = `Will you be my Valentine, ${decodeURIComponent(name)}? 💘🌹`;
    }

    let initialized = false;

    function moveNoAway() {
      if (!initialized) {
        const rect = noBtn.getBoundingClientRect();

        noBtn.style.width = rect.width + "px";
        noBtn.style.height = rect.height + "px";
        noBtn.style.position = "fixed";
        noBtn.style.left = rect.left + "px";
        noBtn.style.top = rect.top + "px";
        noBtn.style.transition = "all 0.25s ease";

        initialized = true;
      }

      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    }

    noBtn.addEventListener("mouseenter", moveNoAway);
    noBtn.addEventListener("touchstart", moveNoAway);

    yesBtn.addEventListener("click", () => {
      const displayName = name ? `, ${decodeURIComponent(name)}` : "";

      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          font-family:Poppins, sans-serif;
          font-size:36px;
          background:linear-gradient(135deg,#ff4d6d,#ff9a9e);
          color:white;
          text-align:center;
        ">
          💖🌹 YES${displayName}!!!<br>You just made my day 💕🥰
        </div>
      `;
    });
  </script>

</body>
</html>
