<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💖</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 28px;
      color: #ff4d6d;
      line-height: 1.3;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      position: relative;
      height: 60px;
    }

    button {
      font-size: 18px;
      padding: 14px 26px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.95);
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758c);
      color: white;
      box-shadow: 0 10px 20px rgba(255, 77, 109, 0.5);
    }

    #no {
      background: #dee2e6;
      color: #333;
      position: absolute;
    }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 id="title">Will you be my Valentine? 💘🥺</h1>

    <div class="buttons">
      <button id="yes">YES 💖</button>
      <button id="no">NO 😈</button>
    </div>

    <div class="hint">👆 Tap carefully… one button is sneaky</div>
  </div>

  <script>
    // 💕 Get name from URL (?name=Cherry)
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");

    if (name) {
      document.getElementById("title").innerText =
        `Hey ${decodeURIComponent(name)} ❤️ Will you be my Valentine? 💕`;
    }

    // 🏃‍♂️ NO button runs away
    const noBtn = document.getElementById("no");

    function moveNoButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton);

    // 💍 YES button win screen
    document.getElementById("yes").addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:20px;
          font-size:34px;
          font-family:Poppins, sans-serif;
          background:linear-gradient(135deg,#ff4d6d,#ff758c);
          color:white;
          text-align:center;
        ">
          💖💍 YAY!!!<br>You just made my day 💕🥰
        </div>
      `;
    });
  </script>
</body>
</html>
